name: fxjzai-ic

x-ic-service: &ic-service
  image: fxjzai-ic:local
  build:
    context: .
  environment:
    IC_DATABASE_URL: postgresql+psycopg://ic:${IC_POSTGRES_PASSWORD}@postgres:5432/ic
    IC_HTTP_TIMEOUT_SECONDS: "20"
  init: true
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ic
      POSTGRES_USER: ic
      POSTGRES_PASSWORD: ${IC_POSTGRES_PASSWORD:?set IC_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${IC_POSTGRES_PORT:-18432}:5432"
    volumes:
      - ic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ic -d ic"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *ic-service
    ports:
      - "${IC_API_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  retention:
    <<: *ic-service
    environment:
      IC_DATABASE_URL: postgresql+psycopg://ic:${IC_POSTGRES_PASSWORD}@postgres:5432/ic
      IC_HTTP_TIMEOUT_SECONDS: "20"
      IC_RETENTION_INTERVAL_SECONDS: "${IC_RETENTION_INTERVAL_SECONDS:-3600}"
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        'while true; do ic retention; sleep "$${IC_RETENTION_INTERVAL_SECONDS}"; done',
      ]

volumes:
  ic-postgres-data:
